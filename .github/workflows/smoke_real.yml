name: Smoke Real

on:
  workflow_dispatch:
    inputs:
      store_ids:
        description: 'Comma-separated store ids; explicitly selecting a backlog store enables only its registered smoke case'
        required: false
        type: string
  schedule:
    - cron: '47 10 * * *'

concurrency:
  group: git-scraper-smoke-real
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-real:
    name: smoke-real
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Start Lightpanda CDP server
        continue-on-error: true
        run: docker run -d --name lightpanda -p 127.0.0.1:9222:9222 lightpanda/browser:nightly

      - name: Probe Lightpanda readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              echo "Lightpanda CDP is ready"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' lightpanda 2>/dev/null || true)" != "true" ]; then
              break
            fi
            sleep 1
          done
          echo "::warning::Lightpanda readiness probe failed; smoke will report the degradation and fall back to Chromium"
          docker logs lightpanda || true

      - name: Run live smoke for supported stores
        env:
          DEBUG: ${{ vars.DEBUG }}
          HTTP_TIMEOUT_MS: ${{ vars.HTTP_TIMEOUT_MS }}
          CONCURRENCY: 1
          USER_AGENT: ${{ vars.USER_AGENT }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          LIGHTPANDA_CDP_URL: ws://127.0.0.1:9222
          SEARCH_TOP_N_PER_STORE: ${{ vars.SEARCH_TOP_N_PER_STORE }}
          SMOKE_MAX_PRODUCTS_PER_STORE: 1
          SMOKE_STORE_IDS: ${{ inputs.store_ids }}
        run: npm run smoke:real

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-real-${{ github.run_id }}
          path: .cache/smoke-real
          if-no-files-found: ignore
          retention-days: 30
